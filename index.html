<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: rgb(158, 21, 39);
            color: #FFFFFF;
            text-align: center;
            max-width: 800px;
            margin: 0% auto;
            padding: 16px;
            border: 5px solid rgb(251, 255, 254);
        }

        main {
            background-color: #8a1414;
            color: rgb(243, 243, 243);
            max-width: 800px;
            margin: 0% auto;
            padding: 16px;
            display: flex;
        }

        img{
            width: 100px;
            height: 100px;
        }
        .artigo-autor {
           font-weight: bold; 
        }

    </style>

<head>

    <body>
        <header>
            <h1>Meu blog tech</h1>
            <p>Vou compartilhar conhecimento sobre tecnologia e programação </p>
        </header>
        <main>
            <img src="larinha.jpg" alt="Logotipo em formato de brasão tecnológico sobre fundo escuro, iluminado por um brilho neon vermelho e laranja. Centro: Um livro aberto. A página esquerda mostra circuitos eletrônicos e a direita tem um capelo (chapéu de formatura) e uma lâmpada. Bem no meio, há uma lâmpada maior com uma engrenagem dentro. Topo: Uma linha de batimento cardíaco com um botão de play no centro. Base: O texto EDU TECH em letras maiúsculas, com uma seta de cursor de mouse apontando para ele logo abaixo.">
            <div>
                 <h2>Meu primeiro projeto</h2>
                 <p  class="artigo-autor"> Por: Larissa Rodrigues</p>
                 <p> Boas vindas ao meu primeiro blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia</p>
                <button>💖 <span>0</span></button>
                <button>🥰 <span>0</span></button>
            </div>
        </main>
    </body>
    <script>
    const botões = document.querySelector("button");

  botões.forEach( function(botão){
    botão.addEventListener("click", botãoClicado);
    function botãoClicado(){
        console.log ("fui clicado");
        let texto = botão.querySelector("span");
        texto.textContent++;
    }

})



        
</script>
</html>
