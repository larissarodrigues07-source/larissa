<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <style>
        header {
            background-color: rgb(126, 19, 5);
            color: #fff6f6;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid rgb(255, 255, 255);
        }

        main {
            background-color: #a13a3a7c;
            color: rgb(0, 0, 0);
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            gap: 16px;
        }

        img {
            width: 100px;
            height: 100px;
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>             
<body>
    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimento sobre tecnologia e programação</p>
    </header>

    <main>
        <img src="larinha.jpg" alt="Logotipo em formato de escudo escuro com detalhes em vermelho e laranja, trazendo um livro aberto no centro com circuitos eletrônicos à esquerda e duas lâmpadas com um chapéu de formatura à direita. O topo exibe uma linha de batimentos cardíacos com o ícone de play, e a parte inferior traz o texto EDU TECH sobre o ponteiro de um mouse.">
        <div>
            <h2>Meu primeiro post</h2>
            <p class="artigo-autor">Por: Larissa Rodrigues</p>
            <p>Boas vindas ao meu primeiro blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia!</p>
            <button>💖​ <span>0</span></button>
            <button>🥶​ <span>0</span></button>
        </div>
    </main>

    <script>
        const botoes = document.querySelectorAll("button");

        botoes.forEach(function (botao) {
            let curtiu = false;

            botao.addEventListener("click", botaoClicado);

            function botaoClicado() {
                console.log("fui clicado");
                let texto = botao.querySelector("span");

                if (curtiu === false) {
                    texto.textContent++;
                    curtiu = true;
                } else {
                    texto.textContent--;
                    curtiu = false;
                }
            }
        });
    </script>
</body>
</html>
